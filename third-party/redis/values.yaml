# Values for the upstream redis chart. REGISTRY-AGNOSTIC on purpose: the golden
# registry (global.imageRegistry) and the Bitnami "Secure Images" opt-in
# (global.security.allowInsecureImages) are injected as Helm parameters per
# environment by the third-party ApplicationSet (from config/thirdparty/*.yaml),
# so this file is portable across forks. Reviewed + gated here in app-delivery.
image:
  # Use the Bitnami-compatible Chainguard redis so the chart's entrypoint works.
  repository: redis-bitnami
  tag: "8.0"

architecture: standalone
auth:
  enabled: true
  existingSecret: redis-auth # provide out-of-band; don't commit secrets

master:
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
