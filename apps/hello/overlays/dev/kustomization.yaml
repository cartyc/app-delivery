apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Env-specific bits only. Registry, image pin, namespace, and hostname are
# injected by the inhouse ApplicationSet from config/environments/dev.yaml.
resources:
  - ../../base
replicas:
  - name: hello
    count: 1
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hello
      spec:
        template:
          spec:
            containers:
              - name: hello
                env:
                  - name: APP_ENV
                    value: dev
