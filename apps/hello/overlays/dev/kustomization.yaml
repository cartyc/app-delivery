apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-dev
resources:
  - ../../base

# Pin the golden Artifact Registry image for this env.
images:
  - name: us-central1-docker.pkg.dev/gc-golden-demo/apps/hello
    newTag: 0.1.0

replicas:
  - name: hello
    count: 1

patches:
  # Env-specific settings.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hello
      spec:
        template:
          spec:
            containers:
              - name: hello
                env:
                  - name: APP_ENV
                    value: dev
                  - name: APP_VERSION
                    value: "0.1.0"
  # Per-env public hostname on the shared gateway.
  - target:
      kind: VirtualService
      name: hello
    patch: |-
      - op: replace
        path: /spec/hosts/0
        value: hello.dev.example.com
