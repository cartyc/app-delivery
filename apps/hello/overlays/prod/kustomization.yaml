apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Env-specific bits only. Registry, image DIGEST, namespace, and hostname come
# from config/environments/prod.yaml via the inhouse ApplicationSet.
resources:
  - ../../base
  - pdb.yaml
replicas:
  - name: hello
    count: 3
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hello
      spec:
        template:
          spec:
            containers:
              - name: hello
                env:
                  - name: APP_ENV
                    value: prod
