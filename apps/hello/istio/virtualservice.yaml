apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: hello
spec:
  # Attaches to the shared ingress Gateway (platform/istio/gateway.yaml).
  gateways:
    - istio-ingress/public-gateway
  hosts:
    # Placeholder — the inhouse ApplicationSet patches this to {{app}}.{{baseDomain}}
    # per environment (from config/environments). CI does the same when rendering.
    - set-by-config.invalid
  http:
    - route:
        - destination:
            host: hello.default.svc.cluster.local
            port:
              number: 80
