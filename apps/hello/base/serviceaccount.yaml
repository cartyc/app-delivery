apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello
  # GKE Workload Identity: bind this KSA to a GCP service account when the app
  # needs Google APIs. Left off by default (the demo needs no GCP access).
  #   annotations:
  #     iam.gke.io/gcp-service-account: hello@<project>.iam.gserviceaccount.com
# The app image lives in the PRIVATE apps registry (ghcr.io/<owner>/apps), so
# every pod running as this ServiceAccount pulls with the `ghcr-pull`
# dockerconfigjson Secret. cluster/bootstrap/bootstrap.sh creates it in each
# app namespace from a read:packages token you supply (docs/PULL-SECRET.md).
imagePullSecrets:
  - name: ghcr-pull
