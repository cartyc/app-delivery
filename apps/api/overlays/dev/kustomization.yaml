apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-dev
resources:
  - ../../base

images:
  - name: us-central1-docker.pkg.dev/gc-golden-demo/apps/api
    newTag: 0.1.0

replicas:
  - name: api
    count: 1

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: APP_ENV
                    value: dev
                  - name: APP_VERSION
                    value: "0.1.0"
  - target:
      kind: VirtualService
      name: api
    patch: |-
      - op: replace
        path: /spec/hosts/0
        value: api.dev.example.com
