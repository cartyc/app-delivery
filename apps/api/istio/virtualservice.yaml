apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api
spec:
  gateways:
    - istio-ingress/public-gateway
  hosts:
    # Placeholder — patched to {{app}}.{{baseDomain}} per env by the ApplicationSet.
    - set-by-config.invalid
  http:
    - route:
        - destination:
            host: api.default.svc.cluster.local
            port:
              number: 80
