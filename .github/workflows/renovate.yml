# Self-hosted Renovate. Runs on a schedule and on demand, opening dependency PRs
# that then flow through the same Validate gate (golden-registry + hardening).
#
# Self-hosted (not the Mend app) because the in-house app images live in
# PRIVATE ghcr.io packages: Renovate reads their tags with this job's
# GITHUB_TOKEN (`packages: read`). That needs no stored registry credential, but
# each apps/<app> package must grant this repository Read under its "Manage
# Actions access" (docs/RENOVATE.md). Chart versions come from public Helm repos.
#
# Required secret:
#   RENOVATE_TOKEN   GitHub App token or fine-grained PAT (contents +
#                    pull-requests write) used to open PRs.
name: Renovate
on:
  schedule:
    - cron: "0 10 * * 1" # Mondays 10:00 UTC
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info
permissions:
  contents: read
jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # read private ghcr.io app-image tags with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build registry host rules (masked)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rules="$(jq -c -n --arg user "$GITHUB_ACTOR" --arg pass "$GITHUB_TOKEN" \
            '[{matchHost:"ghcr.io",hostType:"docker",username:$user,password:$pass}]')"
          echo "::add-mask::$rules"
          echo "RENOVATE_HOST_RULES=$rules" >> "$GITHUB_ENV"

      - name: Renovate
        uses: renovatebot/github-action@0984fb80fc633b17e57f3e8b6c007fe0dc3e0d62 # v40.3.6
        env:
          RENOVATE_HOST_RULES: ${{ env.RENOVATE_HOST_RULES }}
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
