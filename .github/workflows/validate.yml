# PR gate: render every kustomize target, schema-validate, and enforce the
# golden-registry + workload-hardening policies. No cluster required.
name: Validate
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install tools
        run: |
          set -euo pipefail
          # kustomize (pinned release binary — not a curl|bash of a mutable script)
          curl -sfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz kustomize
          sudo mv kustomize /usr/local/bin/
          # kubeconform
          curl -sfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
          # conftest
          curl -sfL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz conftest
          sudo mv conftest /usr/local/bin/
          # helm (pinned release tarball — renders third-party charts for the gate)
          curl -sfL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz | tar xz --strip-components=1 linux-amd64/helm
          sudo mv helm /usr/local/bin/
          # yq (reads the central config in scripts/validate.sh)
          sudo curl -sfL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq

      - name: Render + validate + gate
        run: ./scripts/validate.sh
