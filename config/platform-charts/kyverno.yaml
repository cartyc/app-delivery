# Platform chart (cluster prerequisite) — Kyverno, upstream chart on Chainguard
# images. Its ClusterPolicy CRDs must exist before platform/kyverno/ syncs, so
# it lands at an early sync-wave.
#
# Kyverno's per-component images all inherit `global.image.registry` (default
# reg.kyverno.io) and keep repository paths like `kyverno/background-controller`.
# We mirror the Chainguard images into the golden registry under those SAME
# nested paths (golden/kyverno/<component>), so a single global registry swap
# points every controller + the kyvernopre init + the crds.migration kyverno-cli
# at golden. The image tag defaults to the chart appVersion (v1.19.1), which is
# exactly the golden tag — no per-component tag override needed.
#
# The `test` and `webhooksCleanup` hooks use ghcr.io/kyverno/readiness-checker,
# which Chainguard does not publish, so they're disabled (they're optional helm
# test / pre-delete cleanup jobs). Verified: renders fully golden.
name: kyverno
namespace: kyverno
server: https://kubernetes.default.svc
syncWave: "-20"
chartRepo: https://kyverno.github.io/kyverno/
chart: kyverno
chartVersion: 3.9.1 # ships Kyverno v1.19.1 (matches golden image tags)
goldenRegistry: us-central1-docker.pkg.dev/gc-golden-demo/golden
imageRepos: {}
# single global registry swap -> every component image resolves under golden
# (golden/kyverno/kyverno, /kyverno/background-controller, /kyverno/kyvernopre,
#  /kyverno/cleanup-controller, /kyverno/reports-controller, /kyverno/kyverno-cli)
registryParams:
  - global.image.registry
# literal Helm params: keep the golden mirror the only image source by disabling
# the two hooks that pull ghcr.io/kyverno/readiness-checker (no Chainguard image).
helmParams:
  webhooksCleanup.enabled: "false"
  test.enabled: "false"
imagePullSecrets: []
