# Third-party chart instance — UPSTREAM chart only (no vendor repackagers like
# Bitnami). kube-state-metrics (prometheus-community) splits image.registry from
# image.repository, so it's pointed at golden with a single registry swap
# (registryParams → goldenRegistry), and image.repository is set to the golden
# name; the golden mirror keeps it flat at goldenRegistry/kube-state-metrics.
# (metrics-server was the earlier example, but Chainguard doesn't publish it to
# this org — kube-state-metrics is the available upstream-charted equivalent.)
#
# Consumed by the thirdparty-charts ApplicationSet + the CI gate.
name: kube-state-metrics
env: dev
namespace: kube-system
server: https://kubernetes.default.svc
autosync: true
repoURL: https://github.com/cartyc/app-delivery.git # for the in-repo values file
chartRepo: https://prometheus-community.github.io/helm-charts
chart: kube-state-metrics
chartVersion: "8.5.0" # ships app v2.20.0 (matches golden image tag)
valuesPath: third-party/kube-state-metrics/values.yaml
goldenRegistry: ghcr.io/cartyc/golden
# This chart splits image.registry from image.repository (default
# "kube-state-metrics/kube-state-metrics"): swap the registry, and set the
# repository to the flat golden name in helmParams.
imageRepos: {}
registryParams:
  - image.registry
# Literal Helm params. Tag defaults to the chart appVersion (v2.20.0) = the
# golden tag, but pin it explicitly so the image-source gate sees a fixed tag.
helmParams:
  image.repository: kube-state-metrics
  image.tag: "v2.20.0"
# Pull secret for the PRIVATE golden registry (ghcr.io), created by
# cluster/bootstrap/bootstrap.sh in this namespace. The ApplicationSet maps it to
# the chart's `<imagePullSecretsParam>[N].name`.
imagePullSecretsParam: imagePullSecrets
imagePullSecrets:
  - ghcr-pull
