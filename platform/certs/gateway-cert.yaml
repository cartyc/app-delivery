# Gateway TLS cert, issued by cert-manager. Produces the `public-gateway-cert`
# secret the Istio ingress Gateway references (platform/istio/gateway.yaml).
#
# Demo uses a self-signed ClusterIssuer — swap for an ACME (Let's Encrypt) or
# your internal CA issuer in production. Requires cert-manager (installed at an
# earlier sync-wave via config/platform-charts/cert-manager.yaml).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-gateway-cert
  namespace: istio-ingress
spec:
  secretName: public-gateway-cert
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  dnsNames:
    - "example.com"
    - "*.example.com"
