# AppProject scoping what this repo's Applications may deploy. Applied once at
# bootstrap (alongside app-of-apps.yaml), then git-managed.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo
  namespace: argocd
spec:
  description: In-house apps + platform config delivered from app-delivery
  sourceRepos:
    - https://github.com/cartyc/app-delivery.git
    # Upstream (project-published) Helm repos used by the third-party lane.
    # Vendor repackagers (e.g. Bitnami) are intentionally avoided.
    - https://kubernetes-sigs.github.io/metrics-server/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: demo-dev
    - server: https://kubernetes.default.svc
      namespace: demo-prod
    - server: https://kubernetes.default.svc
      namespace: istio-ingress
    - server: https://kubernetes.default.svc
      namespace: istio-system
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist:
    # Permissive within the project (still scoped to this project's Apps).
    # Tighten to specific groups/kinds for a locked-down environment.
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
