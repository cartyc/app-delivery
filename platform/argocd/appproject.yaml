# AppProject scoping what this repo's Applications may deploy. Applied once at
# bootstrap (alongside app-of-apps.yaml), then git-managed.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo
  namespace: argocd
spec:
  description: In-house apps + platform config delivered from app-delivery
  sourceRepos:
    - https://github.com/cartyc/app-delivery.git
    # Upstream (project-published) Helm repos used by the platform + third-party
    # lanes. Vendor repackagers (e.g. Bitnami) are intentionally avoided.
    - https://charts.jetstack.io # cert-manager (platform-charts)
    - https://kyverno.github.io/kyverno/ # kyverno (platform-charts)
    - https://prometheus-community.github.io/helm-charts # kube-state-metrics (third-party)
  destinations:
    - server: https://kubernetes.default.svc
      namespace: demo-dev
    - server: https://kubernetes.default.svc
      namespace: demo-prod
    - server: https://kubernetes.default.svc
      namespace: istio-ingress
    - server: https://kubernetes.default.svc
      namespace: istio-system
    - server: https://kubernetes.default.svc
      namespace: kube-system
    # Platform charts (config/platform-charts/*.yaml set these namespaces).
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist:
    # Permissive within the project (still scoped to this project's Apps).
    # Tighten to specific groups/kinds for a locked-down environment.
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
