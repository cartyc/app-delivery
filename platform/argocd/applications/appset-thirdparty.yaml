# Third-party charts ApplicationSet. One Application per file in
# config/thirdparty/*.yaml. UPSTREAM charts only — pointed at Chainguard images
# via per-component image params (imageRepos, prefixed with goldenRegistry) plus
# literal helmParams. Multi-source: upstream chart + in-repo (registry-agnostic)
# values. Add a chart by adding a config file — no manifest edits.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: thirdparty-charts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10" # after platform charts + platform config
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/cartyc/app-delivery.git
        revision: main
        files:
          - path: config/thirdparty/*.yaml
  template:
    metadata:
      name: "{{.name}}-{{.env}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: demo
      destination:
        server: "{{.server}}"
        namespace: "{{.namespace}}"
  # sources + helm params + syncPolicy need loops/conditionals, so they're built
  # in a text-templated patch (goTemplate can't do structural loops in the
  # parsed template body).
  templatePatch: |
    spec:
      sources:
        - repoURL: {{ .chartRepo }}
          chart: {{ .chart }}
          targetRevision: "{{ .chartVersion }}"
          helm:
            valueFiles:
              - $values/{{ .valuesPath }}
            parameters:
              {{- range $param, $image := .imageRepos }}
              - name: {{ $param }}
                value: {{ $.goldenRegistry }}/{{ $image }}
              {{- end }}
              {{- range $param, $value := .helmParams }}
              - name: {{ $param }}
                value: "{{ $value }}"
              {{- end }}
              {{- range $i, $secret := .imagePullSecrets }}
              - name: imagePullSecrets[{{ $i }}].name
                value: "{{ $secret }}"
              {{- end }}
        - repoURL: {{ .repoURL }}
          targetRevision: main
          ref: values
      syncPolicy:
        {{- if .autosync }}
        automated:
          prune: true
          selfHeal: true
        {{- end }}
