apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Cluster-scoped platform config (namespaces + shared Istio). Synced by the
# `platform` ArgoCD Application. ArgoCD delivery CRs live under argocd/ and are
# applied by the app-of-apps, not by this kustomization.
resources:
  - namespaces
  - istio
  - kyverno # Kyverno ClusterPolicies (requires Kyverno installed; see kyverno/README.md)
